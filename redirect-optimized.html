<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Download Link</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; }
        main { width: 100%; max-width: 720px; padding: 36px; background: #16213e; border-radius: 12px; }
        h1 { margin-top: 0; color: #00d4ff; }
        p { line-height: 1.6; }
        #destination { color: #b8c8db; overflow-wrap: anywhere; word-break: break-all; }
        .button { display: inline-block; margin: 12px 12px 0 0; padding: 16px 22px; background: #e94560; border-radius: 6px; color: white; font-weight: bold; text-decoration: none; }
        .back { background: #245279; }
        .button:focus { outline: 3px solid #00d4ff; outline-offset: 4px; }
        [hidden] { display: none; }
    </style>
</head>
<body>
    <main>
        <h1 id="heading">Open Download Link</h1>
        <p id="gameName"></p>
        <p id="message">Checking the link...</p>
        <p id="destination"></p>
        <a id="openLink" class="button" rel="noopener noreferrer" hidden>Open link</a>
        <a class="button back" href="index.html">Back to Games</a>
    </main>
    <script src="link-status.js"></script>
    <script src="catalog.js"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var link = gameCatalog.describeLink(params.get('url'));
        document.getElementById('gameName').textContent = params.get('game') || 'PS4 Game';
        if (link) {
            document.getElementById('message').textContent = 'This opens an external website. File availability is managed by that site.';
            document.getElementById('destination').textContent = link.url;
            var button = document.getElementById('openLink');
            button.setAttribute('href', link.url);
            button.textContent = 'Open ' + link.label;
            button.removeAttribute('hidden');
        } else {
            document.getElementById('heading').textContent = 'Link unavailable';
            document.getElementById('message').textContent = gameCatalog.isMissing(params.get('url')) ? 'The host reports that this file does not exist. Return to the catalogue to choose another link.' : 'This link is malformed, points to a closed host, or is not a download link. Return to the catalogue to choose another link.';
        }
    </script>
</body>
</html>
