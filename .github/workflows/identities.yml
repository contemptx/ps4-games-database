name: Resolve unique game identities
on:
  push:
    branches: [main]
    paths: ['scripts/game_identities.py', 'scripts/identity_entries.cjs', '.github/workflows/identities.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh IGDB metadata']
    types: [completed]
permissions:
  contents: write
  actions: write
concurrency:
  group: game-identities
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test identity rules
        run: |
          python3 -m unittest discover -s tests -p 'test_game_identities.py'
          node tests/test_identity_counts.cjs
      - name: Resolve identities and edition parents
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python3 scripts/game_identities.py
      - name: Version identity data for browser caches
        run: python3 scripts/stamp_catalog.py
      - name: Publish counts and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-identities.json game-identities.js identity-review.json index.html ps4-games-optimized.html ps4-pwa-optimized.html processing.html
          if ! git diff --cached --quiet; then
            git commit -m 'Resolve unique game identities and edition relationships'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Deploy identity data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run static.yml --ref main
