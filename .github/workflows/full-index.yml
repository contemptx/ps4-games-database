name: Process full catalogue
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Pages or host checks per source in this batch (1–250)
        default: '100'
        required: true
      batches_left:
        description: Maximum batches including this one; processing stops when queues finish or pause
        default: '120'
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: full-catalogue-index
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate parsers and checkpoint rules
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_catalog.cjs
          node tests/test_paging.cjs
      - name: Process next source batches
        id: index
        env:
          PAGE_LIMIT: ${{ inputs.limit }}
        run: python3 scripts/full_index.py --limit "$PAGE_LIMIT" --minutes 20
      - name: Validate generated catalogue
        run: python3 scripts/validate_index.py
      - name: Publish validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-metadata.json release-metadata.js superpsx-catalog.json superpsx-catalog.js additional-catalog.json additional-catalog.js link-status.json link-status.js index-state.json index-progress.json index-progress.js source-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update catalogue releases and processing checkpoints'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Deploy catalogue and continue remaining work
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BATCHES_LEFT: ${{ inputs.batches_left }}
          CAN_CONTINUE: ${{ steps.index.outputs.continue }}
        run: python3 scripts/continue_index.py
      - name: Preserve checkpoints and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-checkpoint-${{ github.run_id }}
          retention-days: 7
          path: |
            index-state.json
            index-progress.*
            release-metadata.*
            superpsx-catalog.*
            additional-catalog.*
            source-review.json
            link-status.*
          if-no-files-found: error
