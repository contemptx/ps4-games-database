name: Refresh release metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-metadata
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read public source labels
        run: python3 scripts/collect_release_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-pages
          path: release-source-pages/
          if-no-files-found: error
