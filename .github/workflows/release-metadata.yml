name: Refresh release metadata
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum public source pages (1–500)
        default: '100'
        required: true
permissions:
  contents: read
concurrency:
  group: release-metadata
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read public source labels
        env:
          PAGE_LIMIT: ${{ inputs.limit }}
        run: python3 scripts/release_metadata.py --limit "$PAGE_LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata-results
          path: release-results/
          if-no-files-found: error
